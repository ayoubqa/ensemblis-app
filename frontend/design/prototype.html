<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ensemblis — The marketplace for AI work</title>

<style>
:root{
  --bg:#F4F5F2;--surface:#FFFFFF;--surface2:#F9FAF8;--ink:#12181B;--muted:#5A6567;--line:#E1E4DF;--line2:#CDD2CC;
  --accent:#0B5D57;--accent-ink:#FFFFFF;--accent-soft:#E2EFEC;--ok:#1E7F4F;--ok-soft:#E3F2E9;--warn:#A86A12;--warn-soft:#F8EEDC;--bad:#B4382E;--bad-soft:#F8E4E1;
  --avl:91%;--avc:28%;--shadow:0 12px 40px rgba(18,24,27,.08);
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;--sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0D1112;--surface:#141A1B;--surface2:#101617;--ink:#E8EDEC;--muted:#8F9B9C;--line:#242E2F;--line2:#33403F;--accent:#4FC3B4;--accent-ink:#06211E;--accent-soft:#12302D;--ok:#5CCB92;--ok-soft:#12291D;--warn:#E0A64C;--warn-soft:#2D2311;--bad:#F08578;--bad-soft:#341815;--avl:20%;--avc:78%;--shadow:0 12px 40px rgba(0,0,0,.4)}
}
:root[data-theme="dark"]{--bg:#0D1112;--surface:#141A1B;--surface2:#101617;--ink:#E8EDEC;--muted:#8F9B9C;--line:#242E2F;--line2:#33403F;--accent:#4FC3B4;--accent-ink:#06211E;--accent-soft:#12302D;--ok:#5CCB92;--ok-soft:#12291D;--warn:#E0A64C;--warn-soft:#2D2311;--bad:#F08578;--bad-soft:#341815;--avl:20%;--avc:78%;--shadow:0 12px 40px rgba(0,0,0,.4)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:760px;margin:0 auto;padding:0 24px}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrapflex{flex-wrap:wrap}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stack>*+*{margin-top:16px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .in{height:60px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:26px;letter-spacing:-.02em;cursor:pointer}
.logo .mk{width:24px;height:24px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.logo .mk svg{width:14px;height:14px;stroke-width:2.6}
nav.main{display:flex;gap:4px}
nav.main button{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
nav.main button:hover{color:var(--ink);background:var(--surface)}
nav.main button.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);position:relative}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.dot{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 2px var(--bg)}
.pf{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.pf .av{width:26px;height:26px;border-radius:50%;font-size:11px}
.menu{position:absolute;right:0;top:44px;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:60}
.menu button,.menu .mi{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.rel{position:relative}
.bottom{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);transition:transform .12s,background .12s,border-color .12s}
.btn:hover{border-color:var(--ink)}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.lg{padding:14px 22px;font-size:15px}.btn.sm{padding:6px 11px;font-size:13px}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);transition:.12s}
button.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.gray{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.card.tight{padding:16px}.card.flat{background:var(--surface2)}
.card h3{font-size:16px;font-weight:600;margin-bottom:4px}
.hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.stat{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:13px;color:var(--muted)}
.stat em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
.av{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;background:hsl(var(--h) 38% var(--avl));color:hsl(var(--h) 50% var(--avc));flex:none}
.av.lg{width:64px;height:64px;border-radius:16px;font-size:22px}
input.f,textarea.f,select.f{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);outline:none}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.l{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
/* hero */
.hero{padding:72px 0 32px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,7.2vw,84px);line-height:1;letter-spacing:-.03em;max-width:12ch}
.hero p.sub{font-size:19px;color:var(--muted);margin-top:20px;max-width:46ch}
.brief{margin-top:36px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.brief label{display:block;padding:16px 22px 0;font-size:13px;color:var(--muted);font-weight:600}
.brief textarea{width:100%;border:0;outline:0;resize:none;background:transparent;padding:6px 22px 8px;font-size:19px;line-height:1.45;min-height:112px}
.brief .foot{display:flex;align-items:center;gap:14px;padding:12px 14px 14px 22px;border-top:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.route{font-size:13px;color:var(--muted);flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
.route b{color:var(--ink);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sect{padding:64px 0}
.sect h2{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,44px);letter-spacing:-.02em;line-height:1.08;margin-bottom:10px}
.pagehead{padding:40px 0 20px}
.pagehead h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.5vw,48px);letter-spacing:-.02em;line-height:1.05}
.pagehead p{color:var(--muted);margin-top:8px;max-width:60ch}
.step-n{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
/* flowbar */
.flow{display:flex;gap:6px;align-items:center;padding:22px 0 6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.flow span{display:flex;align-items:center;gap:6px}
.flow span.on{color:var(--ink);font-weight:600}.flow span.done{color:var(--accent)}
.flow i{width:22px;height:1px;background:var(--line2);display:block}
/* checklist */
.chk li{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--muted);transition:color .3s}
.chk li .ic{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:.25s}
.chk li.done{color:var(--ink)}.chk li.done .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk li.doing{color:var(--ink)}.chk li.doing .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.chk li .ic svg{width:12px;height:12px;stroke-width:3;opacity:0}.chk li.done .ic svg{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal{animation:rv .45s ease both}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s linear}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* agent cards */
.acard{display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;cursor:pointer}
.acard:hover{border-color:var(--ink);transform:translateY(-2px)}
.acard .stats{display:flex;gap:16px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
.acard .stats b{color:var(--ink);font-weight:600}
.pick{border:1.5px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.opt{cursor:pointer;transition:.15s}.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--surface2) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:24px 0 20px}
.tabs button{padding:11px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.hbar{display:grid;grid-template-columns:150px 1fr 64px;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.hbar .b{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.hbar .b i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,14,15,.5);z-index:80;display:grid;place-items:center;padding:20px;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;width:100%;max-width:440px;box-shadow:var(--shadow);animation:rv .25s ease;max-height:90vh;overflow:auto}
.modal.wide{max-width:640px}
.modal h3{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
#toasts{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:9px;align-items:center;animation:rv .25s ease;box-shadow:var(--shadow)}
/* report */
.report{display:grid;grid-template-columns:200px 1fr;gap:36px}
.toc{position:sticky;top:84px;align-self:start;font-size:13px}
.toc a{display:block;padding:6px 0;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.toc a:hover{color:var(--ink);border-color:var(--accent)}
.rsec{padding:26px 0;border-bottom:1px solid var(--line)}
.rsec h2{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.015em;margin-bottom:12px}
.rsec p{max-width:66ch;margin-bottom:10px}
.rsec ul{padding-left:20px;max-width:66ch}.rsec li{margin:6px 0}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--accent)}
.split{display:flex;height:44px;border-radius:10px;overflow:hidden;font-size:13px;font-weight:600}
.split div{display:grid;place-items:center}
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.pnode{flex:1;min-width:150px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:relative}
.parrow{display:grid;place-items:center;color:var(--muted);width:28px}
.thumb{width:48px;height:48px;border-radius:12px;border:1px solid var(--line2);font-size:20px;background:var(--surface)}
.thumb:hover{border-color:var(--ink)}
.notice{display:flex;gap:10px;padding:11px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;align-items:flex-start}
.lane{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
footer.ft{border-top:1px solid var(--line);padding:32px 0 48px;margin-top:40px;font-size:13px;color:var(--muted)}
.wiz{display:grid;grid-template-columns:220px 1fr;gap:32px}
.wstep{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);font-size:14px}
.wstep.on{color:var(--ink);font-weight:600}.wstep.done{color:var(--accent)}
.wstep .step-n{width:24px;height:24px;font-size:12px}
.wstep.on .step-n{background:var(--ink);color:var(--bg);border-color:var(--ink)}.wstep.done .step-n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:860px){
  .g3,.g4{grid-template-columns:repeat(2,1fr)}.report{grid-template-columns:1fr}.toc{display:none}.wiz{grid-template-columns:1fr}.wsteps{display:flex;gap:10px;overflow-x:auto}
  nav.main,.pf span.nm,.hideM{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:500}
  .bottom button.on{color:var(--accent)}
  body{padding-bottom:72px}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){
  .g2,.g3,.g4{grid-template-columns:1fr}.g4.keep2,.g2.keep2{grid-template-columns:repeat(2,1fr)}
  .wrap,.narrow{padding:0 16px}.hero{padding:40px 0 16px}.sect{padding:44px 0}.hbar{grid-template-columns:96px 1fr 52px}
  header .in{gap:10px}.card{padding:18px}
}
@media (max-width:860px){#mg,#rg,#ag,#dg{grid-template-columns:1fr!important}}
@media (max-width:560px){.hbar{grid-template-columns:104px 1fr 44px!important}.pnode{min-width:100%}.parrow{width:100%;transform:rotate(90deg);height:24px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Ensemblis brand ===== */
:root{--bg:#F5F6FA;--surface:#FFFFFF;--surface2:#F8F9FC;--ink:#0B1020;--muted:#586178;--line:#E2E5EE;--line2:#CBD0DE;--accent:#5B3DF5;--accent-ink:#FFFFFF;--accent-soft:#ECE8FF;--cyan:#0FB0CB;--avl:92%;--avc:30%;--shadow:0 14px 44px rgba(11,16,32,.08);--serif:'Sora','Manrope',system-ui,sans-serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}

   +sec('r4','Company Comparison',`<div class="tw"><table style="min-width:900px"><tr><th>Company</th><th>HQ</th><th>Approach</th><th>Target customers</th><th>Est. revenue</th><th>Recent development</th><th>Score</th></tr>${rows.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td>€${c[4]}M</td><td>${c[5]}</td><td><div class="row" style="gap:8px"><div class="meter" style="width:56px"><i style="width:${c[6]}%"></i></div>${c[6]}</div></td></tr>`).join('')}</table></div><button class="btn sm" style="margin-top:10px" data-act="toggleAll">${S.showAll?'Show top 10':'Show all 20 companies'}</button>`)
   +sec('r5','Pricing / Positioning',`<p class="small muted">Typical installed price by approach, € per kW</p>${cats.map(c=>`<div class="rrow"><span>${c[0]}</span><div class="rng"><i style="left:${c[1]/5}%;width:${(c[2]-c[1])/5}%"></i></div><b>€${c[1]}–${c[2]}</b></div>`).join('')}<ul style="margin-top:12px"><li><b>Premium:</b> two-phase immersion vendors position on efficiency for the densest AI racks.</li><li><b>Sweet spot:</b> direct-to-chip balances cost with density, and dominates new colocation builds.</li><li><b>Value:</b> rear-door and hybrid systems win retrofit projects in enterprise and banking.</li></ul>`)
   +sec('r6','Strategic Observations',`<ul><li>Mid-sized vendors with credible retrofit stories are under-served by hyperscale-focused players.</li><li>Heat reuse is becoming a purchase criterion in Nordic and Benelux markets, and four vendors now offer it.</li><li>Three vendors under €60M revenue show acquisition-ready profiles: strong product IP and recent commercial traction.</li><li>Standards uncertainty in two-phase fluids is the largest technology risk for immersion buyers.</li><li>Revenue estimates for private companies carry ±15% error and should be validated in expert interviews.</li></ul>`)
   +sec('r7','Sources',`<p class="small muted">${nSrc} sources: ${nV} verified directly, ${nC} cross-referenced, ${nE} estimated.</p><div class="tw"><table><tr><th>Source</th><th>Type</th><th>Date</th><th>Status</th></tr>${srows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.type}</td><td>${x.date}</td><td>${vTag(x.st)}</td></tr>`).join('')}</table></div><button class="btn sm" style="margin-top:10px" data-act="toggleSrc">${S.showAllSrc?'Show fewer':'Show all 47 sources'}</button>`)
  :sec('r1','Summary',`<p>${esc(a.name)} completed your request: ${esc(t.text)}</p><p class="muted">Your ${a.out.toLowerCase()} is ready. The full sample report in this prototype is shown for the data center cooling scenario.</p>`)+sec('r2','Deliverable contents',`<div class="grid g2">${a.caps.map(c=>`<div class="card tight"><b>${c}</b><div class="sk" style="height:10px;margin-top:12px;width:90%"></div><div class="sk" style="height:10px;margin-top:8px;width:70%"></div></div>`).join('')}</div>`);

   <div class="stack"><div class="card"><h3>How useful was this work?</h3><div class="stars" style="margin:12px 0">${[1,2,3,4,5].map(n=>`<button data-act="star" data-n="${n}" class="${(S.fb.stars||0)>=n?'on':''}" aria-label="${n} star">★</button>`).join('')}</div>

    <div class="card"><h3>Performance data</h3><p class="small muted" style="margin-bottom:6px">Every task feeds the Agent Performance Graph. Ensemblis learns which agents perform best for specific types of work.</p><div class="kv"><span>Task success</span><span class="tag ok">Completed</span></div><div class="kv"><span>Execution time</span><b>${rec.time||a.time}</b></div><div class="kv"><span>Cost</span><b>${eur(cost)}</b></div><div class="kv"><span>Customer satisfaction</span><span>${S.fb.sent?(S.fb.stars?'★'.repeat(S.fb.stars)+'☆'.repeat(5-S.fb.stars)+' · ':'')+S.fb.o:'Awaiting your rating'}</span></div><div class="kv"><span>Repeat usage</span><span>${S.wfDone?'Recurring workflow':'Not yet'}</span></div></div></div></div>
   <div class="card" id="automate" style="margin-top:20px;border-color:var(--accent)"><div id="autoc">${autoCard()}</div></div></div></div></div>${footer()}`}

    <div class="card"><div class="eyebrow">SPENDING</div><b style="font-size:34px;letter-spacing:-.02em">${eur(monthSpend())}</b><div class="small muted">This month, in demo credits</div><div style="margin-top:8px">${lineChart(seeded(5,12,60,80).map(Math.round),{h:100,label:'Spending'})}</div><button class="btn sm" style="margin-top:10px" data-act="go" data-r="billing">View payments</button></div></div></div></div>${footer()}`}

 src:(d)=>modal(srcModal(+d.i)),

 scrollAuto:()=>{const e=document.getElementById('automate');e.scrollIntoView({behavior:'smooth',block:'center'});e.style.boxShadow='0 0 0 4px var(--accent-soft)';setTimeout(()=>e.style.boxShadow='',1600)},
 activateWf:()=>{const t=S.task,f=S.wfFreq;S.workflows.unshift({id:'w'+Date.now(),name:t.title+' (recurring)',freq:f,last:'Today',next:NEXT[f],cost:price(t),agentId:t.agentId,active:true,text:t.text,steps:teamFor(t).map(m=>m.desc)});S.wfDone=true;toast('Workflow activated');render(true)},
 runWf:(d)=>{const w=S.workflows.find(x=>x.id==d.id),t=classify(w.text,w.agentId);t.wf=w.name;S.task=t;S.menu=null;go('run')},
 wfPause:(d)=>{const w=S.workflows.find(x=>x.id==d.id);w.active=!w.active;toast(w.active?'Workflow resumed':'Workflow paused');render(true)},
 editWfModal:(d)=>{const w=S.workflows.find(x=>x.id==d.id);modal(`<h3>Edit workflow</h3><p class="muted small" style="margin:4px 0 14px">Update the task this workflow runs.</p><label class="l">Name</label><input class="f" id="wfname" value="${esc(w.name)}"><label class="l" style="margin-top:12px">Task</label><textarea class="f" id="wftext" rows="3">${esc(w.text)}</textarea><div class="row" style="margin-top:18px"><button class="btn" data-act="closeModalBg">Cancel</button><button class="btn p sp" data-act="wfSave" data-id="${w.id}">Save changes</button></div>`)},
 wfSave:(d)=>{const w=S.workflows.find(x=>x.id==d.id),nm=document.getElementById('wfname').value.trim(),tx=document.getElementById('wftext').value.trim();if(!tx)return;const t=classify(tx,w.agentId);w.name=nm||w.name;w.text=tx;w.cost=price(t);w.steps=teamFor(t).map(m=>m.desc);modal('');toast('Workflow updated');render(true)},
 deleteWf:(d)=>modal(`<h3>Delete this workflow?</h3><p class="muted small" style="margin:6px 0 16px">This can't be undone. It won't affect work already delivered.</p><div class="row"><button class="btn" data-act="closeModalBg">Keep workflow</button><button class="btn bad" data-act="confirmDeleteWf" data-id="${d.id}">Delete workflow</button></div>`),
 confirmDeleteWf:(d)=>{S.workflows=S.workflows.filter(x=>x.id!=d.id);modal('');toast('Workflow deleted');render(true)},
 newWfModal:()=>modal(wfModalHtml()),
 wfCreate:()=>{const tk=S.tasks.find(x=>x.id==document.getElementById('wfbase').value),f=document.getElementById('wffreq').value;S.workflows.unshift({id:'w'+Date.now(),name:tk.title+' (recurring)',freq:f,last:'—',next:NEXT[f],cost:tk.cost,agentId:tk.agent,active:true,text:tk.text,steps:['Collect inputs','Run analysis','Verify results','Deliver report']});modal('');toast('Workflow activated');render(true)},
 assign:(d)=>{S.direct=+d.id;S.draft='';go('new')},
 hire:(d)=>{S.direct=+d.id;S.draft='';go('new')},
 tryEx:(d)=>{const a=AG(S.p.id);S.draft=examplesFor(a)[+d.i][0];S.direct=a.id;go('new')},
 wfToggle:(d)=>{const i=S.workforce.indexOf(+d.id);i<0?S.workforce.push(+d.id):S.workforce.splice(i,1);toast(i<0?'Added to your workforce':'Removed from your workforce');render(true)},
 addWf:(d)=>{S.workforce.push(+d.id);toast('Added to your workforce');render(true)},
 viewTask:(d)=>{const t=S.tasks.find(x=>x.id==d.id);
  if(t.status=='Completed'){S.task=classify(t.text,t.agent==1?null:t.agent);S.task.agentId=t.agent;S.task.title=t.title;S.task.rec=t;S.fb=t.outcome?{o:t.outcome=='Achieved'?'Yes':t.outcome,sent:true}:{};S.showAll=false;S.showAllSrc=false;go('result')}
  else if(t.status=='Running'){S.task=classify(t.text,t.agent);S.task.title=t.title;S.task.existing=t;go('run')}
  else if(t.status=='Failed'){S.task=t;go('failed')}else toast('This task was refunded')},
 another:()=>{const t=S.task;S.task=classify(t.text,alts(AG(t.agent))[0].id);go('plan')},
 otherAgent:(d)=>{const t=S.tasks.find(x=>x.id==d.id);S.task=classify(t.text,alts(AG(t.agent))[0].id);go('plan')},
 runAgain:()=>{S.draft=S.task.text;S.direct=null;go('new')},
 againTask:(d)=>{S.draft=S.tasks.find(x=>x.id==d.id).text;go('new')},
 sendFb:()=>{S.fb.sent=true;const r=S.task.rec;if(r)r.outcome=S.fb.o=='Yes'?'Achieved':S.fb.o=='No'?'Not achieved':'Partially';toast('Thank you. Your feedback helps improve Ensemblis.');render(true)},
 pubtog:(d)=>{const c=S.pub.d[d.k],i=c.indexOf(d.c);i<0?c.push(d.c):c.splice(i,1);render(true)},
 pubtogc:(d)=>{const c=S.pub.d[d.k],i=c.indexOf(d.c);i<0?c.push(d.c):c.splice(i,1)},
 newAgent:()=>{S.pub=pubDefault();go('publish')},
 submitReview:()=>{S.pub.done=true;S.myAgents.push({id:null,name:S.pub.d.name,succ:null,tasks:null,rev:null,status:'In review'});toast('Submitted for review');render()},
 devAgent:(d)=>go('devagent',{i:+d.i}),
 dismissOnboard:()=>{S.onboard.dismissed=true;render(true)},
 addSeat:()=>{const names=['Priya Shah','Tomás Rivera','Anna Kowalski','Jonas Berg'];const nm=names[S.profile.seats.length-1]||('Teammate '+(S.profile.seats.length+1));S.profile.seats.push({name:nm,role:'Member'});toast(nm+' invited');render(true)},
 removeSeat:(d)=>{S.profile.seats.splice(+d.i,1);toast('Seat removed');render(true)},
 resetDemo:()=>modal(`<h3>Reset demo data?</h3><p class="muted small" style="margin:6px 0 16px">This restores credits, tasks and workflows to their starting state. Your profile stays as you set it.</p><div class="row"><button class="btn" data-act="closeModalBg">Cancel</button><button class="btn bad" data-act="confirmReset">Reset</button></div>`),
 confirmReset:()=>{S.credits=100;S.tasks=JSON.parse(JSON.stringify(SNAPSHOT.tasks));S.workflows=JSON.parse(JSON.stringify(SNAPSHOT.workflows));S.workforce=[...SNAPSHOT.workforce];S.myAgents=JSON.parse(JSON.stringify(SNAPSHOT.myAgents));S.fb={};S.onboard={described:false,reviewed:false,result:false,dismissed:false};modal('');toast('Demo data reset');go('dash')},
 openPalette:()=>{cmdSel=0;modal(paletteHtml())},
 cmdgo:(d)=>{const it=(window._palItems||[])[+d.i];modal('');it&&it.act()},
 shortcuts:()=>modal(shortcutsHtml()),
 downloadPdf:()=>{if(typeof print==='function'){toast('Opening print dialog — choose "Save as PDF"');later(()=>window.print(),400)}else toast('Report saved as PDF')},
 exportCsv:async()=>{const t=S.task,a=AG(t.agentId),rec=t.rec||{title:t.title,time:a.time,cost:price(t)},full=t.agentId==1&&!t.multi&&/cooling/i.test(t.text);
  let rows;
  if(full){rows=[['Company','HQ','Approach','Target customers','Est. revenue (EUR M)','Recent development','Score'],...[...COMP2].sort((x,y)=>y[4]-x[4]).map(c=>[c[0],c[1],c[2],c[3],c[4],c[5],c[6]])]}
  else{rows=[['Field','Value'],['Task',rec.title||t.title],['Status','Completed'],['Completed in',rec.time||a.time],['Cost',eur(rec.cost||price(t))]]}
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const filename=(rec.title||t.title||'ensemblis-export').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';
  try{
   const dl=(typeof window!=='undefined'&&window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
   if(!dl){toast('Export isn\'t available in this view');return}
   const r=await dl.save({filename,data:csv});
   toast(r.status=='delivered'?'Sent '+(rows.length-1)+' rows to your chosen destination':'Exported '+(rows.length-1)+' rows to CSV')
  }catch(e){if(e&&e.code=='declined')return;toast('Could not export — try again')}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.wfsel!==undefined){S.wfFreq=t.value;document.getElementById('autoc').innerHTML=autoCard()}
  else if(t.dataset.wf){const w=S.workflows.find(x=>x.id==t.dataset.wf);w.freq=t.value;w.next=NEXT[t.value];toast('Schedule updated');render(true)}
  else if(t.dataset.notif){S.profile.notif[t.dataset.notif]=t.checked}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.pub=='price'){const m=document.getElementById('ppm'),m1=document.getElementById('ppm1');if(m){m.textContent=eur((+t.value||0)*100);m1.textContent=eur(+t.value||0)}}});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');
  if(!el){if(S.menu&&!e.target.closest('.menu')){S.menu=null;header()}return}
  if(el.dataset.act=='closeModalBg'&&e.target!==el)return;
  const a=ACT[el.dataset.act];if(!a)return;if(el.dataset.act!='menu'&&el.dataset.act!='pubin'&&S.menu){S.menu=null}
  a(el.dataset,el)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.bind=='draft'){S.draft=t.value;document.getElementById('route').innerHTML=routeHint(S.draft)}
  else if(t.dataset.bind=='q'){S.f.q=t.value;S.loading=false;updateGrid()}
  else if(t.dataset.set){S.profile[t.dataset.set]=t.value;header()}
  else if(t.id=='cmdq'){const pos=t.selectionStart;cmdSel=0;document.querySelector('.modal').innerHTML=paletteHtml(t.value);const ni=document.getElementById('cmdq');ni.focus();ni.setSelectionRange(pos,pos)}
  else if(t.dataset.pub){const k=t.dataset.pub;S.pub.d[k]=k=='price'?(+t.value||0):t.value;
    if(k=='price'){document.getElementById('pp1').textContent=eur(S.pub.d.price);document.getElementById('pp2').textContent=eur((S.pub.d.price*.8).toFixed(2));document.getElementById('pp3').textContent=eur((S.pub.d.price*.2).toFixed(2))}}
  else if(t.dataset.econ){S.econ[t.dataset.econ]=+t.value;const e2=S.econ,cr=e2.price*(100-e2.fee)/100,pl=e2.price*e2.fee/100,$=id=>document.getElementById(id);
    $('e1').textContent=eur(e2.price);$('lp').textContent=eur(e2.price);$('lf').textContent=e2.fee+'%';$('lt').textContent=e2.tasks;$('ec').textContent=eur(cr.toFixed(2));$('ep').textContent=eur(pl.toFixed(2));$('em').textContent=eur(Math.round(cr*e2.tasks));
    $('esplit').innerHTML=`<div style="width:${100-e2.fee}%;background:var(--accent);color:var(--accent-ink)">Creator ${eur(cr.toFixed(2))}</div><div style="width:${e2.fee}%;background:var(--line2)">${eur(pl.toFixed(2))}</div>`}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.sel;if(!k)return;S.f[k]=t.type=='checkbox'?t.checked:t.value;S.loading=false;updateGrid()});
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag=='input'||tag=='textarea';
  if((e.key=='k'||e.key=='K')&&(e.metaKey||e.ctrlKey)){e.preventDefault();return ACT.openPalette()}
  if(e.key=='/'&&!typing&&!document.querySelector('.modal')){e.preventDefault();return ACT.openPalette()}
  if(document.activeElement&&document.activeElement.id=='cmdq'){
    const items=window._palItems||[];
    if(e.key=='ArrowDown'){e.preventDefault();if(items.length){cmdSel=Math.min(items.length-1,cmdSel+1);refreshCmdRes()}return}
    if(e.key=='ArrowUp'){e.preventDefault();if(items.length){cmdSel=Math.max(0,cmdSel-1);refreshCmdRes()}return}
    if(e.key=='Enter'){if(items[cmdSel]){modal('');items[cmdSel].act()}return}
  }
  if(e.key=='?'&&!typing&&!document.querySelector('.modal')){e.preventDefault();return ACT.shortcuts()}
  if((e.key=='n'||e.key=='N')&&!typing&&!document.querySelector('.modal')){e.preventDefault();return ACT.newTask?ACT.newTask():go('new')}
  if(e.key=='Enter'&&(e.metaKey||e.ctrlKey)&&S.route=='home')ACT.submit();
  if(e.key=='Escape'){modal('');S.menu=null;header()}
});
render();
</script>
