# Render Blueprint for the Ensemblis backend: the API and the execution worker.
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for
# the values marked `sync: false`. The database is NOT here: use a managed
# Postgres (e.g. Neon: https://neon.tech) and paste its connection string.
#
# The frontend is deployed separately (e.g. Vercel) with
# NEXT_PUBLIC_API_URL = the API service's https://....onrender.com URL.
#
# Topology (v4):
#   ensemblis-api     web service. On every start it applies pending Prisma
#                     migrations (`prisma migrate deploy` via dist/ops/migrate.js;
#                     a database created by the old `prisma db push` is baselined
#                     first — no data is touched) and then serves the API.
#   ensemblis-worker  background worker. Claims jobs from the Postgres queue and
#                     runs executions, recovery and recurring objectives. It waits
#                     for the API to finish migrating before it starts.
#
# COST: background workers need a paid Render plan (`plan: starter` below), and an
# always-on worker keeps the database awake 24/7 (check your Neon plan's compute
# allowance). To run on the free plan instead, change THIS FILE (a dashboard edit
# is overwritten by the next Blueprint sync): delete the ensemblis-worker service
# and set EMBEDDED_WORKER to "true" on ensemblis-api. Executions then run inside the
# API and pause while the free instance sleeps.
#
# The API keeps the same service-level variables v3 had (JWT_SECRET and
# IP_HASH_SALT keep their existing generated values). Settings both services use
# are listed on each service: keep the copies identical.

services:
  - type: web
    name: ensemblis-api
    runtime: node
    plan: free
    # Pick the region closest to your database (Neon "AWS Europe Central" = frankfurt).
    region: frankfurt
    rootDir: backend
    # --include=dev: TypeScript and type packages are devDependencies, and
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm ci --include=dev && npm run build
    # migrate deploy (never `db push`), then start the API.
    startCommand: npm run start:render
    # /health checks the database and reports queue health; /health/live is a plain liveness probe.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # The separate ensemblis-worker runs executions. "true" only without that service (see COST above).
      - key: EMBEDDED_WORKER
        value: "false"

      # --- entered by you in the Render dashboard ---
      - key: DATABASE_URL # direct (non-pooled) connection string, with ?sslmode=require
        sync: false
      - key: CORS_ORIGIN # your frontend URL, e.g. https://ensemblis.vercel.app (comma-separate several)
        sync: false
      - key: APP_URL # your frontend URL — used in emails, share links and Stripe redirects
        sync: false
      - key: OPENAI_API_KEY # Groq API key from https://console.groq.com/keys
        sync: false
      - key: SIGNUP_INVITE_CODE # leave empty for open sign-up
        sync: false
      # Operators who may open /admin. Each address must also be VERIFIED
      # (email link, or `npm run ops:verify-email -- you@example.com`).
      - key: ADMIN_EMAILS
        sync: false
      - key: TAVILY_API_KEY # optional web search (otherwise keyless Wikipedia)
        sync: false
      - key: RESEND_API_KEY # optional email (verification, notifications, password reset)
        sync: false
      - key: EMAIL_FROM # e.g. Ensemblis <hello@yourdomain.com>
        sync: false
      - key: STRIPE_SECRET_KEY # optional real payments — use test keys first
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # endpoint: https://<this service>/api/billing/stripe/webhook
        sync: false
      - key: TURNSTILE_SITE_KEY # optional bot check on sign-up and guest trial
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # --- AI provider: Groq via its OpenAI-compatible API (same on the worker) ---
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      # gpt-oss is a reasoning model: keep its hidden "thinking" short so answers aren't cut off.
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      - key: OPENAI_FAST_MODEL
        value: openai/gpt-oss-20b
      # Groq's free tier allows few tokens per minute: one model call at a time per process.
      - key: MAX_CONCURRENT_LLM
        value: "1"
      - key: LLM_TIMEOUT_MS
        value: "120000"

      # --- cost & abuse protection (same on the worker) ---
      - key: STARTING_CREDITS_CENTS
        value: "3000"
      - key: DEMO_TOPUP_ENABLED
        value: "true"
      - key: DEMO_TOPUP_MAX_CENTS
        value: "2000"
      - key: MAX_TASKS_PER_USER_PER_DAY # executions started per user per UTC day
        value: "5"
      - key: MAX_TASKS_PER_DAY_GLOBAL # executions started across the server per UTC day
        value: "150"
      - key: MAX_DESCRIPTION_LENGTH
        value: "4000"
      - key: SEARCH_DAILY_BUDGET
        value: "30"

      # --- guest trial ("try without an account") (same on the worker) ---
      - key: GUEST_TRIAL_ENABLED
        value: "true"
      - key: GUEST_CREDITS_CENTS # covers one execution (plans are capped at 7 steps ≈ €23 incl. verification)
        value: "5000"
      - key: GUEST_MAX_TASKS # executions a guest may start
        value: "1"
      - key: GUEST_TRIALS_PER_IP_PER_DAY
        value: "2"
      - key: GUEST_TRIALS_PER_DAY
        value: "30"
      - key: GUEST_RETENTION_DAYS
        value: "7"

  - type: worker
    name: ensemblis-worker
    runtime: node
    plan: starter # paid: Render has no free background workers
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # The API applies migrations; the worker waits until they are recorded, then starts.
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: WORKER_CONCURRENCY
        value: "2"

      # --- entered by you: the same values as on ensemblis-api ---
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- keep identical to ensemblis-api ---
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      - key: OPENAI_FAST_MODEL
        value: openai/gpt-oss-20b
      - key: MAX_CONCURRENT_LLM
        value: "1"
      - key: LLM_TIMEOUT_MS
        value: "120000"
      - key: MAX_TASKS_PER_USER_PER_DAY
        value: "5"
      - key: MAX_TASKS_PER_DAY_GLOBAL
        value: "150"
      - key: SEARCH_DAILY_BUDGET
        value: "30"
      - key: GUEST_MAX_TASKS
        value: "1"
      - key: GUEST_RETENTION_DAYS
        value: "7"
