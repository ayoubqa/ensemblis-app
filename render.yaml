# Render Blueprint for the Ensemblis backend (free web service).
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for
# the values marked `sync: false`. The database is NOT here: create a free
# Postgres on Neon (https://neon.tech) and paste its connection string.
#
# The frontend is deployed separately on Vercel (NEXT_PUBLIC_API_URL = this
# service's https://....onrender.com URL).
services:
  - type: web
    name: ensemblis-api
    runtime: node
    plan: free
    # Pick the region closest to your Neon database (Neon "AWS Europe Central"
    # = frankfurt, "US East" = virginia/ohio).
    region: frankfurt
    rootDir: backend
    # --include=dev: TypeScript and type packages are devDependencies, and
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm install --include=dev && npm run build
    # Syncs the schema (prisma db push, never with --accept-data-loss), seeds
    # the agent catalog (idempotent), then starts the API.
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true

      # --- entered by you in the Render dashboard ---
      - key: DATABASE_URL # Neon connection string, must include ?sslmode=require
        sync: false
      - key: CORS_ORIGIN # your Vercel URL, e.g. https://ensemblis.vercel.app (comma-separate several)
        sync: false
      - key: OPENAI_API_KEY # Groq API key from https://console.groq.com/keys
        sync: false
      - key: SIGNUP_INVITE_CODE # leave empty for open sign-up
        sync: false

      # --- AI provider: Groq free plan via its OpenAI-compatible API ---
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      # gpt-oss is a reasoning model: keep its hidden "thinking" short so answers aren't cut off.
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      # Groq's free tier allows few tokens per minute: run one model call at a time.
      - key: MAX_CONCURRENT_LLM
        value: "1"
      - key: LLM_TIMEOUT_MS
        value: "120000"

      # --- cost & abuse protection ---
      - key: STARTING_CREDITS_CENTS
        value: "3000"
      - key: DEMO_TOPUP_ENABLED
        value: "true"
      - key: DEMO_TOPUP_MAX_CENTS
        value: "2000"
      - key: MAX_TASKS_PER_USER_PER_DAY
        value: "5"
      - key: MAX_TASKS_PER_DAY_GLOBAL
        value: "150"
      - key: MAX_DESCRIPTION_LENGTH
        value: "4000"

      # --- v3: public URL + owner dashboard (entered by you) ---
      - key: APP_URL # your Vercel URL, e.g. https://ensemblis.vercel.app — used in emails, share links, Stripe redirects
        sync: false
      - key: ADMIN_EMAILS # your own email(s), comma-separated: unlocks /admin
        sync: false

      # --- v3: web research (Tavily when the key is set, otherwise free Wikipedia) ---
      - key: TAVILY_API_KEY # optional, free at https://app.tavily.com
        sync: false
      - key: SEARCH_DAILY_BUDGET
        value: "30"
      # Smaller, faster Groq model for quick helper calls (clarifying questions).
      - key: OPENAI_FAST_MODEL
        value: openai/gpt-oss-20b

      # --- v3: email via Resend (optional; off until both are set) ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM # e.g. Ensemblis <hello@yourdomain.com>
        sync: false

      # --- v3: Stripe Checkout (optional; off until both are set — use test keys first) ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # endpoint: https://<this service>/api/billing/stripe/webhook
        sync: false

      # --- v3: Cloudflare Turnstile bot check (optional; off until both are set) ---
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # --- v3: guest trial ("try without signing up") ---
      - key: GUEST_TRIAL_ENABLED
        value: "true"
      # Enough for any one "focused" task with the default catalog (max ≈ €45).
      - key: GUEST_CREDITS_CENTS
        value: "5000"
      - key: GUEST_MAX_TASKS
        value: "1"
      - key: GUEST_TRIALS_PER_IP_PER_DAY
        value: "2"
      - key: GUEST_TRIALS_PER_DAY
        value: "30"
      - key: GUEST_RETENTION_DAYS
        value: "7"
      - key: IP_HASH_SALT
        generateValue: true

      # --- v3: task features ---
      - key: FOLLOWUP_COST_CENTS
        value: "200"
      - key: CLARIFY_ENABLED
        value: "true"
      - key: MAX_ATTACHMENTS
        value: "3"
      - key: MAX_ATTACHMENT_CHARS
        value: "40000"
      - key: DEV_TEST_RUNS_PER_DAY
        value: "3"
