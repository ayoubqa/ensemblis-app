# Render Blueprint for the Ensemblis backend: the API, which also runs the execution worker.
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for
# the values marked `sync: false`. The database is NOT here: use a managed
# Postgres (e.g. Neon: https://neon.tech) and paste its connection string.
#
# The frontend is deployed separately (e.g. Vercel) with
# NEXT_PUBLIC_API_URL = the API service's https://....onrender.com URL.
#
# Topology (v4, free plan):
#   ensemblis-api     web service. On every start it applies pending Prisma
#                     migrations (`prisma migrate deploy` via dist/ops/migrate.js;
#                     a database created by the old `prisma db push` is baselined
#                     first — no data is touched) and then serves the API. It also
#                     runs the execution worker in-process (EMBEDDED_WORKER="true"):
#                     claims jobs from the Postgres queue and runs executions,
#                     recovery and recurring objectives.
#
# TRADE-OFF: Render has no free background workers, so this file defines no separate
# worker service. Executions pause while the free API instance sleeps and resume when
# it wakes; recurring objectives and the guest cleanup also run only while it is
# awake. To get a standalone always-on worker instead (paid, and it keeps the database
# awake 24/7 — check your Neon plan's compute allowance), change THIS FILE (a dashboard
# edit is overwritten by the next Blueprint sync): add a `type: worker` service
# (`plan: starter`, `npm run start:worker`) with the same environment as ensemblis-api,
# and set EMBEDDED_WORKER back to "false". See DEPLOYMENT.md section 1.
#
# The API keeps the same service-level variables v3 had (JWT_SECRET and
# IP_HASH_SALT keep their existing generated values).

services:
  - type: web
    name: ensemblis-api
    runtime: node
    plan: free
    # Pick the region closest to your database (Neon "AWS Europe Central" = frankfurt).
    region: frankfurt
    rootDir: backend
    # --include=dev: TypeScript and type packages are devDependencies, and
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm ci --include=dev && npm run build
    # migrate deploy (never `db push`), then start the API.
    startCommand: npm run start:render
    # /health checks the database and reports queue health; /health/live is a plain liveness probe.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # No separate worker service: this process runs executions (see TRADE-OFF above).
      # Set "false" only if you add a standalone ensemblis-worker.
      - key: EMBEDDED_WORKER
        value: "true"

      # --- entered by you in the Render dashboard ---
      - key: DATABASE_URL # direct (non-pooled) connection string, with ?sslmode=require
        sync: false
      - key: CORS_ORIGIN # your frontend URL, e.g. https://ensemblis.vercel.app (comma-separate several)
        sync: false
      - key: APP_URL # your frontend URL — used in emails, share links and Stripe redirects
        sync: false
      - key: OPENAI_API_KEY # Groq API key from https://console.groq.com/keys
        sync: false
      - key: SIGNUP_INVITE_CODE # leave empty for open sign-up
        sync: false
      # Operators who may open /admin. Each address must also be VERIFIED
      # (email link, or `npm run ops:verify-email -- you@example.com`).
      - key: ADMIN_EMAILS
        sync: false
      - key: TAVILY_API_KEY # optional web search (otherwise keyless Wikipedia)
        sync: false
      - key: RESEND_API_KEY # optional email (verification, notifications, password reset)
        sync: false
      - key: EMAIL_FROM # e.g. Ensemblis <hello@yourdomain.com>
        sync: false
      - key: STRIPE_SECRET_KEY # optional real payments — use test keys first
        sync: false
      - key: STRIPE_WEBHOOK_SECRET # endpoint: https://<this service>/api/billing/stripe/webhook
        sync: false
      - key: TURNSTILE_SITE_KEY # optional bot check on sign-up and guest trial
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # --- AI provider: Groq via its OpenAI-compatible API ---
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      # gpt-oss is a reasoning model: keep its hidden "thinking" short so answers aren't cut off.
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_MAX_TOKENS
        value: "8192"
      - key: OPENAI_FAST_MODEL
        value: openai/gpt-oss-20b
      # Optional premium model for plan/step/verify calls, with Groq above as the fallback. OFF until
      # PREMIUM_API_KEY (an api.openai.com key, not the Groq key) is set; spend is capped per UTC day
      # from priced usage (PROVIDER_PRICING). See DEPLOYMENT.md §2.
      - key: PREMIUM_MODEL
        value: gpt-5.5
      - key: PREMIUM_API_KEY # OpenAI API key; leave empty to keep every call on Groq
        sync: false
      - key: PREMIUM_REASONING_EFFORT
        value: low
      - key: PREMIUM_DAILY_BUDGET_EUR
        value: "2"
      # Groq's free tier allows few tokens per minute: one model call at a time per process.
      - key: MAX_CONCURRENT_LLM
        value: "1"
      - key: LLM_TIMEOUT_MS
        value: "120000"

      # --- internal cost accounting (owner dashboard only; never shown to customers) ---
      # List prices checked on 2026-10-23 against the providers' own pages (listed in "sources"):
      # Groq gpt-oss-120b $0.15 in / $0.075 cached / $0.60 out, gpt-oss-20b $0.075 / $0.037 / $0.30,
      # OpenAI gpt-5.5 $5 / $0.50 / $30 per million tokens (standard tier, prompts under 272K tokens);
      # Tavily basic search 1 credit = $0.008 pay-as-you-go (the 1,000 free monthly credits are not
      # deducted, so search cost is an upper bound); 1 USD = 0.8925 EUR (ECB reference rate
      # 22 Oct 2026: EUR 1 = USD 1.1205). Re-check and update "asOf" when prices change: the owner
      # dashboard flags prices older than 90 days. Fixed hosting plans and payment fees are left
      # unconfigured ("fixedMonthlyEur", "paymentFees" — see DEPLOYMENT.md) so they are reported as
      # unknown rather than zero.
      - key: PROVIDER_PRICING
        value: '{"asOf":"2026-10-23","sources":["https://console.groq.com/docs/model/openai/gpt-oss-120b","https://console.groq.com/docs/model/openai/gpt-oss-20b","https://developers.openai.com/api/docs/models/gpt-5.5","https://docs.tavily.com/documentation/api-credits","https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html"],"models":{"openai/gpt-oss-120b":{"inputPerMTok":0.15,"cachedInputPerMTok":0.075,"outputPerMTok":0.6,"currency":"USD"},"openai/gpt-oss-20b":{"inputPerMTok":0.075,"cachedInputPerMTok":0.037,"outputPerMTok":0.3,"currency":"USD"},"gpt-5.5":{"inputPerMTok":5,"cachedInputPerMTok":0.5,"outputPerMTok":30,"currency":"USD"}},"tools":{"search:tavily":{"perCall":0.008,"currency":"USD"}},"fx":{"USD":0.8925}}'

      # --- cost & abuse protection ---
      - key: STARTING_CREDITS_CENTS
        value: "3000"
      - key: DEMO_TOPUP_ENABLED
        value: "true"
      - key: DEMO_TOPUP_MAX_CENTS
        value: "2000"
      - key: MAX_TASKS_PER_USER_PER_DAY # executions started per user per UTC day
        value: "5"
      - key: MAX_TASKS_PER_DAY_GLOBAL # executions started across the server per UTC day
        value: "150"
      - key: MAX_DESCRIPTION_LENGTH
        value: "4000"
      - key: SEARCH_DAILY_BUDGET
        value: "30"
      # Runaway guard per execution (the code default is 600000). The largest legitimate run — 7 steps,
      # a revision, two verification rounds, at OPENAI_MAX_TOKENS=8192 — stays under ~300k tokens, so
      # 400k never cuts real work short. A runaway then costs at most ~$0.10–0.25 on gpt-oss-120b
      # (~$4.50–12 on gpt-5.5, where PREMIUM_DAILY_BUDGET_EUR caps the day anyway). A stopped
      # execution fails and is refunded in full.
      - key: MAX_TOKENS_PER_EXECUTION
        value: "400000"
      # The server's daily ceiling on model tokens, all calls together (planning, steps, verification,
      # suggestions, memory). Without it the caps above multiply out to ~80M tokens/day (150 executions
      # x 400k + 600 plans): up to ~$19-48/day on gpt-oss-120b. 10M tokens is ~65 executions of ~150k
      # and caps a day at ~$2.40 (input-heavy) to $6 (all output). New work is refused when the rest of
      # the day can't finish one execution; every call stops at the ceiling. See DEPLOYMENT.md §2.
      - key: DAILY_TOKEN_BUDGET
        value: "10000000"

      # --- guest trial ("try without an account") ---
      - key: GUEST_TRIAL_ENABLED
        value: "true"
      - key: GUEST_CREDITS_CENTS # credits; covers one execution (plans are capped at 7 steps ≈ 2,300 credits incl. verification)
        value: "5000"
      - key: GUEST_MAX_TASKS # executions a guest may start
        value: "1"
      - key: GUEST_TRIALS_PER_IP_PER_DAY
        value: "2"
      - key: GUEST_TRIALS_PER_DAY
        value: "30"
      - key: GUEST_RETENTION_DAYS
        value: "7"
